<!-- templates/whiteboard/room.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whiteboard Room: {{ room_name|escape }}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #toolbar {
            margin-bottom: 10px;
            user-select: none;
        }
        canvas { 
            border: 1px solid #000; 
            display: block;
            touch-action: none;
            background: #fff;
            max-width: 100%;
        }
        #loadingIndicator {
            display: none;
            color: green;
            font-weight: bold;
            margin-left: 10px;
        }
        #errorMessage {
            display: none;
            color: red;
            margin-top: 10px;
        }
        button, select, input[type="color"], input[type="range"] {
            margin-right: 10px;
            vertical-align: middle;
            padding: 5px;
        }
        @media (max-width: 600px) {
            #toolbar { flex-wrap: wrap; }
            button, select, input { margin-bottom: 10px; }
        }
    </style>
</head>
<body>
    <h2>Room: {{ room_name|escape }}</h2>
    <div id="toolbar" aria-label="Drawing tools and controls">
        <label for="toolSelector">Tool:
            <select id="toolSelector" name="toolSelector" aria-label="Select drawing tool">
                <option value="pen">Pen</option>
                <option value="eraser">Eraser</option>
            </select>
        </label>
        <label for="colorPicker">Color:
            <input type="color" id="colorPicker" name="colorPicker" value="#ff0000" aria-label="Select drawing color" />
        </label>
        <label for="penSize">Size:
            <input type="range" id="penSize" name="penSize" min="1" max="20" value="2" aria-label="Adjust pen size" />
        </label>
        <button id="undoBtn" type="button" aria-label="Undo last action">Undo</button>
        <button id="redoBtn" type="button" aria-label="Redo last undone action">Redo</button>
        <button id="clearBtn" type="button" aria-label="Clear canvas">Clear Canvas</button>
        <button id="saveSnapshot" type="button" aria-label="Save snapshot">Save Snapshot</button>
        <span id="loadingIndicator" role="status" aria-live="polite">Saving...</span>
    </div>
    <div id="errorMessage" role="alert"></div>
    <canvas id="whiteboard" aria-label="Whiteboard drawing area"></canvas>

    <script>
        const roomName = "{{ room_name|escapejs }}";
        const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
        let ws;
        let reconnectAttempts = 0;
        const MAX_RECONNECT_ATTEMPTS = 5;

        // Canvas setup
        const canvas = document.getElementById("whiteboard");
        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        
        // UI Elements
        const toolSelector = document.getElementById('toolSelector');
        const colorPicker = document.getElementById('colorPicker');
        const penSize = document.getElementById('penSize');
        const undoBtn = document.getElementById('undoBtn');
        const redoBtn = document.getElementById('redoBtn');
        const clearBtn = document.getElementById('clearBtn');
        const saveSnapshotBtn = document.getElementById('saveSnapshot');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const errorMessage = document.getElementById('errorMessage');

        // State variables
        let drawing = false;
        let lastX = 0;
        let lastY = 0;
        const MAX_HISTORY = 50;
        let undoStack = [];
        let redoStack = [];

        function connectWebSocket() {
            ws = new WebSocket(`${protocol}://${window.location.host}/ws/whiteboard/${roomName}/`);
            
            ws.onopen = () => {
                reconnectAttempts = 0;
                errorMessage.style.display = 'none';
            };

            ws.onmessage = async (event) => {
                try {
                    const data = JSON.parse(event.data);
                    switch (data.type) {
                        case "draw_event":
                            draw(data);
                            break;
                        case "clear_canvas":
                            ctx.clearRect(0, 0, canvas.width, canvas.height);
                            saveState(false);
                            updateUndoRedoButtons();
                            break;
                        case "full_canvas":
                            await restoreState(data.dataUrl);
                            updateUndoRedoButtons();
                            break;
                    }
                } catch (e) {
                    console.error("WebSocket message error:", e);
                }
            };

            ws.onclose = () => {
                if (reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
                    reconnectAttempts++;
                    setTimeout(connectWebSocket, 2000 * reconnectAttempts);
                    errorMessage.textContent = `Reconnecting... (${reconnectAttempts}/${MAX_RECONNECT_ATTEMPTS})`;
                    errorMessage.style.display = 'block';
                } else {
                    errorMessage.textContent = 'Connection lost. Please refresh the page.';
                    errorMessage.style.display = 'block';
                }
            };

            ws.onerror = (e) => {
                console.error("WebSocket error:", e);
            };
        }

        function saveState(pushToUndo=true) {
            try {
                const dataUrl = canvas.toDataURL('image/png');
                if (pushToUndo) {
                    if (undoStack.length >= MAX_HISTORY) undoStack.shift();
                    undoStack.push(dataUrl);
                    redoStack = [];
                    updateUndoRedoButtons();
                }
            } catch (e) {
                console.warn("saveState failed:", e);
            }
        }

        function restoreState(dataUrl) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    resolve();
                };
                img.onerror = () => resolve();
                img.src = dataUrl;
            });
        }

        function updateUndoRedoButtons() {
            undoBtn.disabled = undoStack.length === 0;
            redoBtn.disabled = redoStack.length === 0;
        }

        function draw(data, saveForUndo = false) {
            ctx.strokeStyle = data.color;
            ctx.lineWidth = data.width;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.beginPath();
            ctx.moveTo(data.from.x, data.from.y);
            ctx.lineTo(data.to.x, data.to.y);
            ctx.stroke();

            if (saveForUndo) saveState();
        }

        function broadcastMessage(msg) {
            if (ws.readyState === WebSocket.OPEN) {
                try {
                    ws.send(JSON.stringify(msg));
                } catch (e) {
                    console.warn("Broadcast failed:", e);
                }
            }
        }

        function broadcastCanvasState() {
            try {
                const dataUrl = canvas.toDataURL('image/png');
                broadcastMessage({ type: 'full_canvas', dataUrl });
            } catch (e) {
                console.warn("broadcastCanvasState failed:", e);
            }
        }

        // Event handlers
        function startDrawing(e) {
            drawing = true;
            const pos = getPosition(e);
            lastX = pos.x;
            lastY = pos.y;
            saveState();
        }

        function stopDrawing() {
            drawing = false;
        }

        function drawMove(e) {
            if (!drawing) return;
            e.preventDefault(); // Prevent scrolling on touch devices

            const pos = getPosition(e);
            const tool = toolSelector.value;
            const color = (tool === 'eraser') ? '#ffffff' : colorPicker.value;
            const width = parseInt(penSize.value, 10);

            const drawEvent = {
                type: "draw_event",
                tool: tool,
                color: color,
                from: { x: lastX, y: lastY },
                to: { x: pos.x, y: pos.y },
                width: width
            };

            draw(drawEvent);
            broadcastMessage(drawEvent);

            lastX = pos.x;
            lastY = pos.y;
        }

        function getPosition(e) {
            const rect = canvas.getBoundingClientRect();
            let x, y;

            if (e.touches && e.touches.length > 0) {
                x = e.touches[0].clientX - rect.left;
                y = e.touches[0].clientY - rect.top;
            } else {
                x = e.offsetX;
                y = e.offsetY;
            }

            // Scale coordinates based on canvas size
            return {
                x: x * (canvas.width / rect.width),
                y: y * (canvas.height / rect.height)
            };
        }

        // Mouse events
        canvas.addEventListener("mousedown", startDrawing);
        canvas.addEventListener("mouseup", stopDrawing);
        canvas.addEventListener("mouseout", stopDrawing);
        canvas.addEventListener("mousemove", drawMove);

        // Touch events
        canvas.addEventListener("touchstart", startDrawing);
        canvas.addEventListener("touchend", stopDrawing);
        canvas.addEventListener("touchcancel", stopDrawing);
        canvas.addEventListener("touchmove", drawMove);

        // Button events
        undoBtn.onclick = async () => {
            if (undoStack.length === 0) return;
            try {
                redoStack.push(canvas.toDataURL('image/png'));
                const lastState = undoStack.pop();
                await restoreState(lastState);
                updateUndoRedoButtons();
                broadcastCanvasState();
            } catch (e) {
                console.error("Undo error:", e);
            }
        };

        redoBtn.onclick = async () => {
            if (redoStack.length === 0) return;
            try {
                undoStack.push(canvas.toDataURL('image/png'));
                const redoState = redoStack.pop();
                await restoreState(redoState);
                updateUndoRedoButtons();
                broadcastCanvasState();
            } catch (e) {
                console.error("Redo error:", e);
            }
        };

        clearBtn.onclick = () => {
            saveState();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            broadcastMessage({ type: "clear_canvas" });
            updateUndoRedoButtons();
        };

        saveSnapshotBtn.addEventListener('click', () => {
            loadingIndicator.style.display = "inline";
            const imageData = canvas.toDataURL('image/png');

            fetch(`/whiteboard/save_snapshot/${roomName}/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({ image_data: imageData })
            })
            .then(res => res.json())
            .then(data => {
                loadingIndicator.style.display = "none";
                if (data.status === "snapshot saved") {
                    alert("Snapshot saved successfully!");
                } else {
                    alert("Error saving snapshot: " + (data.error || "Unknown error"));
                }
            })
            .catch(err => {
                loadingIndicator.style.display = "none";
                alert("Error saving snapshot: " + err.message);
            });
        });

        // CSRF token helper
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        async function loadLatestSnapshot() {
            try {
                const response = await fetch(`/whiteboard/get_latest_snapshot/${roomName}/`);
                const data = await response.json();
                if (data.image_data) {
                    await restoreState(data.image_data);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
                saveState(false);
                updateUndoRedoButtons();
            } catch (e) {
                console.warn("Failed to load snapshot:", e);
                errorMessage.textContent = 'Failed to load previous drawing.';
                errorMessage.style.display = 'block';
            }
        }

        function resizeCanvas() {
            const dataUrl = canvas.toDataURL('image/png');
            canvas.width = Math.floor(window.innerWidth * 0.8);
            canvas.height = Math.floor(window.innerHeight * 0.7);
            
            const img = new Image();
            img.onload = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            };
            img.src = dataUrl;
        }

        window.addEventListener('resize', resizeCanvas);

        // Initialize
        resizeCanvas();
        loadLatestSnapshot();
        updateUndoRedoButtons();
        connectWebSocket();
    </script>
</body>
</html>
